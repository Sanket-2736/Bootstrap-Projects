<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body>
    <div class="container mb-5">
        <h2 class="py-3 text-center">BootStrap Media Classes</h2>
        <div class="row py-5">
            <!-- media classes creates a media box -->
            <!-- if image is present it gets arranged at left
            if img is placed after media-body div it gets aligned at right -->
            <div class="media">
                <img src="user.png" alt="">
                <div class="media-body">
                    <h5 class="mt-0">Sanket Belekar</h5>
                    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Laboriosam iure aut eveniet labore aspernatur recusandae ex harum distinctio tenetur fuga, officia atque voluptatem impedit saepe?</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js" integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+" crossorigin="anonymous"></script>
</body>
</html>
