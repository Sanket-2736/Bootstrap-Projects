<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <title>Bootstrap Pagination</title>
</head>
<body>
    <!-- pagination develoops the pagination bar -->
    <!-- disabled used to disable aby anchor tag -->
    <nav class="mt-5">
        <!-- justify-content-center takes that item to center -->
        <ul class="pagination pagination-lg justify-content-center">
            <li class="page-item">
                <a href="#" class="page-link disabled">Previous</a>
            </li>
            <li class="page-item">
                <a href="#" class="page-link active">1</a>
            </li>
            <li class="page-item">
                <a href="#" class="page-link">2</a>
            </li>
            <li class="page-item">
                <a href="#" class="page-link">3</a>
            </li>
            <li class="page-item">
                <a href="#" class="page-link">Next</a>
            </li>
        </ul>
    </nav>

    <nav>
        <ol class="breadcrumb justify-content-center ">
            <li class="breadcrumb-item"><a href="" class="breadcrumb-link text-decoration-none">Home</a></li>
            <li class="breadcrumb-item"><a href="" class="breadcrumb-link text-decoration-none">Home</a></li>
            <li class="breadcrumb-item"><a href="" class="breadcrumb-link text-decoration-none">Home</a></li>
            <li class="breadcrumb-item"><a href="" class="breadcrumb-link text-decoration-none">Home</a></li>
            <li class="breadcrumb-item"><a href="" class="breadcrumb-link text-decoration-none">Home</a></li>
        </ol>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js" integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+" crossorigin="anonymous"></script>
</body>
</html>
