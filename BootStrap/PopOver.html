<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js" integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s" crossorigin="anonymous"></script>
    <script>
        $(function(){
            $('#example').popover();
        });
        $(function(){
            $('#example3').popover({
                html : true,
                placement : "right",
                title : "Pop-Over title",
                content : "<h1>Lorem ipsum</h1> dolor sit amet, <u>consectetur</u> adipisicing elit. <strong>Consequuntur</strong> provident non et,<br> laborum blanditiis consequatur."            });
        });
        $(function(){
            $('#showBtn').click(function(){
                $('#example3').popover('toggle');
            });
            $('#hideBtn').click(function(){
                $('#example3').popover('hide');
            });
        });
    </script>
</head>
<body>
    
    <div class="container">
        <h2 class="py-3 text-center">BootStrap PopOver</h2>
        <div class="row py-5">
            <div class="col-md-6 mx-auto">
                <button class="btn btn-success" data-placement="bottom" title="Pop-Over title" data-toggle="popover" data-content="Lorem ipsum dolor sit amet, consectetur adipisicing elit. Consequuntur provident non et, laborum blanditiis consequatur.">
                    PopOver
                </button>
            </div>
            <div class="col-md-6 mx-auto">
                <button class="btn btn-primary" data-placement="top" title="Pop-Over title" data-toggle="popover" data-content="Lorem ipsum dolor sit amet, consectetur adipisicing elit. Consequuntur provident non et, laborum blanditiis consequatur.">
                    PopOver
                </button>
            </div>
        </div>
        <div class="row py-5">
            <div class="col-md-6 mx-auto">
                <button class="btn btn-warning" data-placement="bottom" title="Pop-Over title" data-toggle="popover" data-content="Lorem ipsum dolor sit amet, consectetur adipisicing elit. Consequuntur provident non et, laborum blanditiis consequatur.">
                    PopOver
                </button>
            </div>
            <div class="col-md-6 mx-auto">
                <button class="btn btn-info" data-placement="top" title="Pop-Over title" data-toggle="popover" data-content="Lorem ipsum dolor sit amet, consectetur adipisicing elit. Consequuntur provident non et, laborum blanditiis consequatur.">
                    PopOver
                </button>
            </div>
        </div>
        <div class="row py-5">
            <div class="col-md-6">
                <button id="example" data-placement="left" title="Pop-Over title" data-toggle="popover" data-content="Lorem ipsum dolor sit amet, consectetur adipisicing elit. Consequuntur provident non et, laborum blanditiis consequatur." class="btn btn-primary">
                    Pop-Over Id
                </button>
            </div>
            <!-- using html elements : -->
            <div class="col-md-6">
                <button id="example3"  data-toggle="popover" class="btn btn-primary">
                    Pop-Over HTML
                </button>
            </div>
            
        </div>
        <!-- event listners -->
        <div class="row py-5">
            <div class="col-md-6">
                <button id="showBtn" class="btn btn-secondary">
                    Show
                </button>
            </div>
            <div class="col-md-6">
                <button id="hideBtn" class="btn btn-secondary">
                    Hide
                </button>
            </div>
        </div>
    </div>
</body>
</html>
