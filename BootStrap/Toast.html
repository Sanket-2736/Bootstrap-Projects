<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toast</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js" integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s" crossorigin="anonymous"></script>
    <script>
        $(function(){
            $(".toast").toast({
                animation: false, //removes the fade animation form toast
                autohide : false
            });
            $("#showBtn").click(function(){
                $("#myToast").toast('show');
            });
            $("#hideBtn").click(function(){
                $("#myToast").toast('hide');
            });

            // events : show, shown, hide, hidden.bs.toast
        });
    </script>
    <style>
        i{
            color: blue;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="py-3 text-center">BootStrap Toast Plugin</h2>
        <div class="row py-3">
            <div class="col">
                <div class="toast" id="myToast" >
                    <!-- data-autohide="false" deactivates the auto-closing of toast -->
                    <!-- data-delay="3000" autodeletes the toast after specified time interval -->
                    <!-- show class makes toast appear on browser on refreshing it -->
                    <div class="toast-header">
                        <i class="fa-brands fa-facebook"></i>
                        <strong class="m-auto">BootStrap Toast</strong>
                        <small class="text-muted m-auto">1 sec ago..</small>
                        <button class="close" data-dismiss="toast">
                            <span>&times;</span>
                        </button>
                    </div>
                    <div class="toast-body">
                        <p>Anna sent you a friend request!</p>
                    </div>
                </div>
            <div class="col justify-content-center">
                <button id="showBtn" class="m-5 btn btn-info">Show</button>
                <button id="hideBtn" class="m-5 btn btn-success">Hide</button>
            </div>
        </div>
    </div>
</body>
</html>
