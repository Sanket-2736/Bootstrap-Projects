<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha384-KyZXEAg3QhqLMpG8r+Knujsl5+Yo3p5FS2J8vN56v5+cceVqodp4fl4Zl/4CKfdF" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-cgU/NXnFVcTwnC4b1PfW9NU3nHpWgGbb3oLKS0fz3pNqIB4NccsI6Lg9kVXj2brL" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-DZ+BAgFiEWh1QZ1Zk5WxKhvNqYJYTPO82D7/xwB7JALB4wz3FfO/pGPsNkE3+x0I" crossorigin="anonymous"></script>
    <script>
        $(function(){
            $('[data-toggle="tooltip"]').tooltip();
        });
    //    $("#showBtn").click(function(){
    //     $('[data-bs-toggle="tooltip"]').tooltip("show");
    //     // other values : 1) toggle : shows tooltip untill the button is clicked
    //     // 2) hide : hides tooltip
    //     // 3) dispose : deleted the tooltip
    //     // 4) html : sets the html content of the tooltip
    //     // 5) disable : diasabled the tooltip
    //     // 6) enable : enabled the tooltip
    //    });
    //    $("#hideBtn").click(function(){
    //     $('[data-bs-toggle="tooltip"]').tooltip("hide");
    //    })
        $("#element").on('show.bs.tooltip', function(){
            alert("show");
            // more events : shown.bs.tooltip, hide.bs.tooltip, hidden.bs.tooltip, inserted.bs.tooltip
        });
    </script>
</head>
<body>
    <button class="btn btn-primary" id="element" data-placement="top" data-toggle="tooltip" title="Tooltip!">Test</button>
    <button class="btn btn-warning m-5" id="showBtn">Toggle</button>
    <button class="btn btn-success m-5" id="hideBtn">Hide</button>
</body>
</html>
